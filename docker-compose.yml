version: '3.8'

################################################################################
# College ERP - Docker Compose Configuration
# This file defines all services required for the College ERP system
################################################################################

services:
  # ============================================================================
  # MongoDB Database Service
  # Primary database for storing all application data
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: college-erp-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: college-erp
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - college-erp-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/college-erp --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ============================================================================
  # Redis Cache Service  
  # Used for session storage, caching, and real-time features
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: college-erp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - college-erp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ============================================================================
  # Backend API Service
  # Node.js/Express API server with AI capabilities and real-time features
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-erp-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Application Configuration
      NODE_ENV: production
      PORT: 5000
      
      # Database Configuration  
      MONGODB_URI: mongodb://admin:adminpassword@mongodb:27017/college-erp?authSource=admin
      REDIS_URL: redis://redis:6379
      
      # Authentication Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRE: 1h
      JWT_REFRESH_EXPIRE: 7d
      
      # Cloud Storage Configuration
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      
      # AI Services Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Payment Gateway Configuration
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      
      # Frontend Integration
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - college-erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ============================================================================
  # Frontend React Application
  # Modern React UI with dark-neon theme and real-time updates
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-erp-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - college-erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ============================================================================
  # Nginx Reverse Proxy (Production Profile)
  # Load balancer and SSL termination for production deployments
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: college-erp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - college-erp-network
    profiles:
      - production
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

# ==============================================================================
# Network Configuration
# ==============================================================================
networks:
  college-erp-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: college-erp-br0
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

# ==============================================================================
# Volume Configuration
# ==============================================================================
volumes:
  # MongoDB persistent storage
  mongodb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mongodb
      
  mongodb_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mongodb-config
      
  # Redis persistent storage  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
